[package]
name = "minecloud-node"
version = "0.1.0"
edition = "2024"

[dependencies]
serde               = { version = "1.0.229", features = ["derive"] }
serde_json          = "1.0.151"
tokio               = { version = "1.53.1", features = ["full"] }
async-trait         = "0.1.91"
delegate            = "0.13.5"
colored             = "3.1.1"
rand                = "0.10.2"
actix-web           = "4.14.0"
actix-ws            = "0.4.0"
sysinfo             = "0.39.6"
chrono              = { version = "0.4.45", features = ["serde"] }
uuid                = { version = "1.24.0", features = ["v4", "serde"] }
bx                  = { git = "https://github.com/ThePhoenixPixel/bx.git", version = "1.2.0"}
mysql               = "28.0.0"
once_cell           = "1.21.4"
strum               = "0.28.0"
strum_macros        = "0.28.0"
database_manager    = { git = "https://github.com/ThePhoenixPixel/database_manager.git", branch = "master" }
reqwest             = {  version = "0.13.4", features = ["json"] }
futures-util        = "0.3.33"
log = "0.4.33"

[features]
default             = ["mysql"]

# Database driver fetures
sqlite              = ["database_manager/derive", "database_manager/sqlite"]
mysql               = ["database_manager/derive", "database_manager/mysql"]


# Rest Api
rest-api            = []
